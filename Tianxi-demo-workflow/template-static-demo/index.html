<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Template</title>
    <link rel="stylesheet" href="./styles.css?v=1" />
  </head>
  <body>
    <main class="demo-shell">
      <aside class="demo-sidebar" aria-label="Demo 导航">
        <strong class="demo-brand">Project Demo</strong>
        <nav id="demo-nav" class="demo-nav"></nav>
      </aside>

      <section class="demo-stage">
        <header class="demo-header">
          <h1 id="page-title">快速 Demo 模板</h1>
          <p id="page-desc">先跑通主流程，再逐步还原关键视觉细节。</p>
        </header>

        <div id="page-content" class="demo-content"></div>

        <footer class="demo-composer">
          <div id="prompt-editor" class="demo-input" contenteditable="true" role="textbox" aria-label="输入框"></div>
          <button id="send-button" type="button">发送</button>
        </footer>
      </section>
    </main>

    <script src="./script.js?v=1"></script>

</html>
